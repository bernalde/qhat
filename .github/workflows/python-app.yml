name: Python application

on:
  push:
    branches:
      - main
      - research/ordering-mechanism-2026-10-09
  pull_request:
    branches: '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python tests and CLI regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14.8'
        cache: 'pip'

    - name: Report versions
      run: |
        lsb_release -a
        uname -a
        python -V
        pip --version

    - name: Patch pyLIQTR wheel
      run: |
        set -euxo pipefail
        pip download --dest=python-wheels --no-deps --ignore-requires-python --no-binary :all: pyLIQTR
        cd python-wheels
        tar -xzvf pyliqtr-*.tar.gz
        plver=$(awk '/^Version:/ {print $2}' < pyliqtr-*/PKG-INFO)
        cd "pyliqtr-$plver"
        sed -i -e '/python_requires/d' setup.py
        sed -i -e '/Requires-Python:/d' PKG-INFO src/pyLIQTR.egg-info/PKG-INFO
        pip wheel --no-deps --wheel-dir=.. .
        cd ../..
        rm -rf "python-wheels/pyliqtr-$plver" "python-wheels/pyliqtr-${plver}.tar.gz"

    - name: Install dependencies
      id: install
      run: |
        set -euxo pipefail
        pip install --upgrade pip
        pip install --find-links=python-wheels .

    # Preserve independent coverage after a test failure; the job still fails.
    # Failed setup must skip tests instead of producing misleading test failures.
    - name: Test common-unit-tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: common
      run: python -m pytest tests/ -v

    - name: Test analysis-unit-tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: analysis
      run: python -m pytest tests/ -v

    - name: Test hamgen
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: hamiltonian_generator
      run: python hamgen.py

    - name: Test analysis-trotter
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: analysis
      run: python driver.py

    - name: Test analysis-pauli-lcu
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: analysis
      run: python driver.py -p method=pauli-lcu

    - name: Test analysis-dbl-factor
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: analysis
      run: python driver.py -p method=double-factorization
