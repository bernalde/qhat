name: Exact response window checks
on:
  push:
    paths:
      - numerical_audit/exact_response_windows/**
      - numerical_audit/prospective_reference/engine.py
      - numerical_audit/prospective_reference/evidence/results/**
      - .github/workflows/exact-response-windows.yml
  pull_request:
    paths:
      - numerical_audit/exact_response_windows/**
      - numerical_audit/prospective_reference/engine.py
      - numerical_audit/prospective_reference/evidence/results/**
      - .github/workflows/exact-response-windows.yml
permissions:
  contents: read
jobs:
  exact-window-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: python:3.12-slim
      options: --cpus=1 --memory=512m --memory-swap=512m
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Pinned numerical environment
        run: python -m pip install -r numerical_audit/exact_response_windows/requirements.txt
      - name: Exact-domain and resource-failure regressions
        working-directory: numerical_audit/exact_response_windows
        run: python -m pytest test_exact.py test_preflight_metadata.py -q
      - name: Authenticate complete delivery and independently enumerate/replay
        shell: bash
        run: |
          python numerical_audit/exact_response_windows/delivery.py check --delivery numerical_audit/exact_response_windows/evidence
          cp -r numerical_audit/exact_response_windows/evidence "$RUNNER_TEMP/exact-window-evidence"
          python numerical_audit/exact_response_windows/verify.py --output "$RUNNER_TEMP/exact-window-evidence/results"
          python numerical_audit/exact_response_windows/delivery.py check --delivery "$RUNNER_TEMP/exact-window-evidence" --replay-decisions-only
