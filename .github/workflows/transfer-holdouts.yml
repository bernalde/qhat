name: Prospective transfer checks
on:
  push:
    paths:
      - numerical_audit/transfer_holdouts/**
      - numerical_audit/state_holdouts/*.py
      - numerical_audit/prospective_reference/*.py
      - numerical_audit/symmetric_response/*.py
      - numerical_audit/compiled_accuracy/*.py
      - numerical_audit/compiled_accuracy/requirements.txt
      - .github/workflows/transfer-holdouts.yml
  pull_request:
    paths:
      - numerical_audit/transfer_holdouts/**
      - numerical_audit/state_holdouts/*.py
      - numerical_audit/prospective_reference/*.py
      - numerical_audit/symmetric_response/*.py
      - numerical_audit/compiled_accuracy/*.py
      - numerical_audit/compiled_accuracy/requirements.txt
      - .github/workflows/transfer-holdouts.yml
permissions:
  contents: read
jobs:
  transfer-holdouts-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: python:3.12.12-slim
      options: --cpus=1 --memory=512m --memory-swap=512m
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NUMBA_CACHE_DIR: /tmp/transfer-numba
    steps:
      - name: Git support for complete source and payload authentication
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust only this checkout for Git authentication
        run: |
          printf '%s\n' 'GIT_CONFIG_COUNT=1' 'GIT_CONFIG_KEY_0=safe.directory' \
            "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Pinned numerical environment
        run: python -m pip install -r numerical_audit/compiled_accuracy/requirements.txt
      - name: Coherent objectives, construction, full-space circuits and delivery guards
        run: python -m pytest numerical_audit/transfer_holdouts/test_*.py -q
      - name: Authenticate complete source, payload, archive and resource records
        run: |
          python - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'numerical_audit/transfer_holdouts')
          import delivery, reporting
          root=Path('numerical_audit/transfer_holdouts')
          delivery.check(root/'evidence', commit='HEAD')
          delivery.git_blobs(root, 'HEAD')
          reporting.resources(root/'EXECUTION_CLOSEOUT.json')
          assert delivery.audit.sha(root/'delivery.tar.gz') == delivery.audit.read(root/'INDEPENDENT_COMPLETE.json')['archive_sha256']
          print('ALL_TRANSFER_SOURCE_PAYLOAD_ARCHIVE_GIT_BLOBS_PASSED')
          PYCODE
      - name: Independently replay every frozen objective, circuit, DAG and comparison
        run: python numerical_audit/transfer_holdouts/verify.py --output numerical_audit/transfer_holdouts/evidence/results --receipt-dir "${{ runner.temp }}/transfer-recheck"
