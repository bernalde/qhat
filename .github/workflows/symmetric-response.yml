name: Symmetric response checks
on:
  push:
    paths:
      - numerical_audit/symmetric_response/**
      - numerical_audit/prospective_reference/engine.py
      - numerical_audit/prospective_reference/campaign.py
      - numerical_audit/prospective_reference/one_pass.py
      - numerical_audit/prospective_reference/evidence/results/**
      - .github/workflows/symmetric-response.yml
  pull_request:
    paths:
      - numerical_audit/symmetric_response/**
      - numerical_audit/prospective_reference/engine.py
      - numerical_audit/prospective_reference/campaign.py
      - numerical_audit/prospective_reference/one_pass.py
      - numerical_audit/prospective_reference/evidence/results/**
      - .github/workflows/symmetric-response.yml
permissions:
  contents: read
jobs:
  symmetric-response-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: python:3.12-slim
      options: --cpus=1 --memory=512m --memory-swap=512m
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Pinned numerical environment
        run: python -m pip install -r numerical_audit/symmetric_response/requirements.txt
      - name: Cubic derivation, orientation, boundary and search regressions
        working-directory: numerical_audit/symmetric_response
        run: python -m pytest test_cubic.py test_symmetric_guard.py test_symmetric_provenance.py -q
      - name: Authenticate full delivery and independently verify objectives and circuits
        shell: bash
        run: |
          python numerical_audit/symmetric_response/delivery.py check --delivery numerical_audit/symmetric_response/evidence
          cp -r numerical_audit/symmetric_response/evidence "$RUNNER_TEMP/symmetric-evidence"
          python numerical_audit/symmetric_response/verify.py --output "$RUNNER_TEMP/symmetric-evidence/results"
          python numerical_audit/symmetric_response/delivery.py check --delivery "$RUNNER_TEMP/symmetric-evidence" --replay-decisions-only
